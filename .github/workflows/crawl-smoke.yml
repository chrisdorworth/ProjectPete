name: Crawler Smoke Test

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run crawler smoke tests
        run: npm run test -- --grep "smoke" --workspace=packages/crawlers
        env:
          NODE_ENV: test
