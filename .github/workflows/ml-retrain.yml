name: ML Retrain

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r packages/ml/src/requirements.txt
      - name: Export training data
        run: echo "Run export-training-data script against production"
      - name: Train models
        run: python packages/ml/src/training/train_conversion.py
      - name: Evaluate
        run: python packages/ml/src/training/evaluate.py
