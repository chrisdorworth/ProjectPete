global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "traefik"
    static_configs:
      - targets: ["traefik:8080"]

  - job_name: "command-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["command-service:3000"]

  - job_name: "query-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["query-service:3001"]

  - job_name: "ml-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["ml-service:8000"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "neo4j"
    static_configs:
      - targets: ["neo4j:2004"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
